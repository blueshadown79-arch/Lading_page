<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Rounded Background Circle -->
    <circle cx="34" cy="34" r="32" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Stylized Architectural Glass Building -->
    <path d="M 34 10 L 48 20 L 48 54 L 34 58 L 20 54 L 20 20 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Vertical and Horizontal Glazing Grid -->
    <line x1="34" y1="10" x2="34" y2="58" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="27" y1="21" x2="27" y2="55" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="41" y1="21" x2="41" y2="55" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="20" y1="32" x2="48" y2="32" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="20" y1="44" x2="48" y2="44" stroke="#ffffff" stroke-width="1.8"/>
    
    <!-- Shading accents -->
    <polygon points="34,10 48,20 48,54 34,58" fill="#ffffff" fill-opacity="0.18"/>
  </g>

  <!-- Typography: LAURA GLASS SOLUTIONS -->
  <g transform="translate(82, 10)">
    <text x="0" y="34" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="#0f172a" class="brand-text-name">
      LAURA
    </text>
    <text x="2" y="54" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="4" fill="#0284c7" class="brand-text-sub">
      GLASS SOLUTIONS
    </text>
  </g>
</svg>
